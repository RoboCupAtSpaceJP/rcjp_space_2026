competition:
  # team_name / stage / trial_number は launch 引数で設定するためここには書かない
  fixed_object_name:    "window"                    # rules.yaml/Gazebo モデルのキー
  fixed_object_display_name:  "Window"              # 命令文・/report_capture で使う表示名（省略時は fixed_object_name と同じ）
  portable_object_name: "tape"                      # rules.yaml/Gazebo モデルのキー
  portable_object_display_name: "Tape"              # 命令文・/report_capture で使う表示名（省略時は portable_object_name と同じ）
  portable_object_tf:   "obj_1"                     # TFフレーム名（物体種別を明かさない不透明な名前）
  human_pos_1_tf:       "obj_2"                     # human_pos_1 のTFフレーム名
  human_pos_2_tf:       "obj_3"                     # human_pos_2 のTFフレーム名
  dummy_objects: ["astrobee_freeflyer", "ctb_1023"] # スポーンされるがスコア対象外のダミー物体（最大2個まで）
  human_assignments:                                # 人間障害物の配置設定（最大2人）
    human_pos_1: "person_g"                         # 1人目の見た目。出現させたくない場所は "" or "null"
    human_pos_2: ""                                 # 2人目の見た目。出現させたくない場所は "" or "null"
  time_limit: 900                                   # タスクの制限時間（900秒 = 15分）
